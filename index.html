<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Medicatie-reminder</title>
<meta name="description" content="Offline medicatie-reminder voor twee personen">
<meta name="theme-color" content="#1b6aa0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Medicatie">
<link rel="manifest" href="manifest.json" id="manifest-link">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b6aa0'/%3E%3Crect x='14' y='26' width='36' height='14' rx='7' fill='%23fff' transform='rotate(-35 32 33)'/%3E%3Cpath d='M32 20 l8 13 -13 9z' fill='%2326a57a' transform='rotate(-35 32 33)'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b6aa0'/%3E%3C/svg%3E">
<script>
/* ========== VROEG THEMA ZETTEN (voorkomt flitsen) ========== */
(function(){try{var s=(JSON.parse(localStorage.getItem('medicatie-reminder.v1'))||{}).settings||{};var t=s.theme||'auto';var dark=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);var h=document.documentElement;h.dataset.mode=dark?'dark':'light';if(s.fontLarge)h.classList.add('font-large');if(s.highContrast)h.classList.add('hc');}catch(e){}})();
</script>
<style>
/* =========================================================
   1. ONTWERPTOKENS (licht / donker / hoog contrast)
   ========================================================= */
:root{
  --bg:#edf3f7; --surface:#ffffff; --surface-2:#f4f8fb; --text:#13232f; --muted:#4c606f; --border:#cbd8e2;
  --primary:#1b6aa0; --primary-hover:#155683; --on-primary:#ffffff;
  --ok:#1b7a50; --ok-bg:#e2f3ea; --warn:#8f5400; --warn-bg:#fff1d9; --danger:#b02e24; --danger-bg:#fde7e5; --info-bg:#e3eef8;
  --focus:#e08a00; --accent:#2f80c2; --radius:14px; --radius-s:10px;
  --shadow:0 1px 2px rgba(16,40,60,.06),0 6px 18px rgba(16,40,60,.07);
  --hm-ok:#2e9d68; --hm-late:#e8962c; --hm-miss:#d2493e; --hm-none:#dce5ec;
  --bw:1px; color-scheme:light;
}
html[data-mode="dark"]{
  --bg:#0e1821; --surface:#16232e; --surface-2:#1c2c39; --text:#e6eef4; --muted:#a3b5c3; --border:#2d4252;
  --primary:#5aa9e0; --primary-hover:#7dbce8; --on-primary:#06131d;
  --ok:#5fcf98; --ok-bg:#163327; --warn:#f2b45a; --warn-bg:#3a2b12; --danger:#ff8a80; --danger-bg:#3d1c1a; --info-bg:#173246;
  --focus:#ffc24d; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --hm-none:#2a3c4a; color-scheme:dark;
}
html.hc{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#ffffff; --text:#000; --muted:#111; --border:#000;
  --primary:#003b75; --primary-hover:#002850; --on-primary:#fff; --ok:#00552a; --ok-bg:#fff; --warn:#5c3200; --warn-bg:#fff;
  --danger:#8a0000; --danger-bg:#fff; --info-bg:#fff; --focus:#c40069; --bw:2px; --shadow:none;
  --hm-ok:#006b35; --hm-late:#b35c00; --hm-miss:#a30000; --hm-none:#d0d0d0;
}
html.hc[data-mode="dark"]{
  --bg:#000; --surface:#000; --surface-2:#000; --text:#fff; --muted:#f0f0f0; --border:#fff;
  --primary:#ffd400; --primary-hover:#ffe45c; --on-primary:#000; --ok:#6dff9e; --warn:#ffcf5c; --danger:#ff7a7a;
  --ok-bg:#000; --warn-bg:#000; --danger-bg:#000; --info-bg:#000; --focus:#00e5ff; --hm-ok:#00c853; --hm-late:#ffab00; --hm-miss:#ff3d3d; --hm-none:#555;
}

/* =========================================================
   2. BASIS
   ========================================================= */
*,*::before,*::after{box-sizing:border-box}
html{font-size:112.5%;-webkit-text-size-adjust:100%}
html.font-large{font-size:146%}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.5;min-height:100vh}
h1,h2,h3{line-height:1.25;margin:0 0 .5rem}
h1{font-size:1.55rem} h2{font-size:1.2rem} h3{font-size:1.05rem}
p{margin:.3rem 0 .7rem}
a{color:var(--primary)}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:0;background:var(--primary);color:var(--on-primary);padding:.6rem 1rem;z-index:100;border-radius:0 0 8px 0}
.skip:focus{left:0}
.ic{flex:none;vertical-align:middle}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* =========================================================
   3. KOP + PROFIELTABS + NAVIGATIE
   ========================================================= */
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:var(--bw) solid var(--border);box-shadow:var(--shadow)}
.topbar-inner{max-width:1180px;margin:0 auto;padding:.5rem 1rem;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:1.05rem;margin-right:auto;color:var(--primary)}
.brand svg{width:30px;height:30px}
.ptabs{display:flex;gap:.35rem;background:var(--surface-2);padding:.25rem;border-radius:999px;border:var(--bw) solid var(--border)}
.ptab{display:flex;align-items:center;gap:.4rem;min-height:44px;padding:.3rem .9rem;border-radius:999px;border:2px solid transparent;background:transparent;color:var(--text);font:inherit;font-weight:600;cursor:pointer;transition:background .18s,border-color .18s}
.ptab[aria-selected="true"]{background:var(--surface);border-color:var(--pc);box-shadow:inset 0 -4px 0 var(--pc)}
.ptab .pemoji{font-size:1.2rem}
.pbadge{background:var(--danger);color:#fff;border-radius:999px;font-size:.75rem;min-width:1.4rem;padding:0 .35rem;text-align:center;line-height:1.4rem}
.pname{max-width:9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mainnav{background:var(--surface);border-top:var(--bw) solid var(--border)}
.mainnav ul{list-style:none;margin:0 auto;padding:0;display:flex;max-width:1180px}
.mainnav li{flex:1}
.navbtn{width:100%;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:0;color:var(--muted);font:inherit;font-size:.72rem;font-weight:600;cursor:pointer;border-top:3px solid transparent;transition:color .15s,border-color .15s}
.navbtn[aria-current="page"]{color:var(--primary);border-top-color:var(--primary)}
.navbtn:hover{color:var(--primary)}
@media (max-width:899px){
  .mainnav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 14px rgba(0,0,0,.08)}
  body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
  .brand .brand-text{display:none}
  .topbar-inner{flex-wrap:nowrap;gap:.4rem;padding:.4rem .6rem}
  .brand{margin-right:0}
  .ptabs{flex:1;min-width:0}
  .ptab{flex:1;min-width:0;justify-content:center}
}
@media (min-width:900px){
  .navbtn{flex-direction:row;gap:.45rem;font-size:.9rem;border-top:0;border-bottom:3px solid transparent;min-height:48px}
  .navbtn[aria-current="page"]{border-bottom-color:var(--primary)}
}
@media (max-width:420px){.navbtn{font-size:.58rem;letter-spacing:-.01em}.navbtn svg{width:20px;height:20px}.ptab{padding:.3rem .6rem}}

/* =========================================================
   4. LAYOUT, KAARTEN, KNOPPEN, FORMULIEREN
   ========================================================= */
main{max-width:1180px;margin:0 auto;padding:1rem}
.view{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.view-head{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;margin-bottom:.9rem}
.view-head h1{margin:0;outline:none}
.view-head .sub{margin:0;color:var(--muted)}
.view-head .spacer{flex:1}
.card{background:var(--surface);border:var(--bw) solid var(--border);border-radius:var(--radius);padding:1rem;box-shadow:var(--shadow);margin-bottom:1rem}
.card.accent{border-left:6px solid var(--pc,var(--accent))}
.card h2{display:flex;align-items:center;gap:.5rem}
.grid2{display:grid;gap:1rem}
@media(min-width:900px){.grid2.two{grid-template-columns:1fr 1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:44px;min-width:44px;padding:.45rem .95rem;border-radius:var(--radius-s);border:var(--bw) solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;transition:background .15s,transform .12s,border-color .15s}
.btn:hover{border-color:var(--primary)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.primary:hover{background:var(--primary-hover)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
html[data-mode="dark"] .btn.ok{color:#06131d}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:#fff}
.btn.big{min-height:56px;font-size:1.05rem;padding:.6rem 1.3rem}
.btn.small{min-height:44px;padding:.3rem .7rem;font-size:.88rem}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{border-color:var(--border)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:var(--radius-s);border:var(--bw) solid transparent;background:transparent;color:var(--text);cursor:pointer}
.icon-btn:hover{border-color:var(--border);background:var(--surface-2)}
.btn-row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.field{display:flex;flex-direction:column;gap:.25rem;margin-bottom:.8rem}
.field label,.field .lbl{font-weight:600;font-size:.92rem}
.field .hint{font-size:.82rem;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{font:inherit;color:var(--text);background:var(--surface);border:var(--bw) solid var(--border);border-radius:var(--radius-s);min-height:44px;padding:.4rem .65rem;width:100%}
html.hc input,html.hc select,html.hc textarea{border-width:2px}
textarea{min-height:7rem;resize:vertical;line-height:1.45}
input[type=color]{width:56px;height:44px;border:var(--bw) solid var(--border);border-radius:var(--radius-s);background:var(--surface);padding:3px;cursor:pointer}
input[type=checkbox],input[type=radio]{width:22px;height:22px;accent-color:var(--primary);flex:none}
.fgrid{display:grid;gap:0 1rem;grid-template-columns:1fr}
@media(min-width:620px){.fgrid.c2{grid-template-columns:1fr 1fr}.fgrid.c3{grid-template-columns:1fr 1fr 1fr}}
fieldset{border:var(--bw) solid var(--border);border-radius:var(--radius-s);padding:.7rem .9rem .3rem;margin:0 0 .9rem}
legend{font-weight:700;padding:0 .35rem}
.check{display:flex;align-items:center;gap:.55rem;min-height:44px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chipsel{display:inline-flex;align-items:center;gap:.35rem;min-height:44px;padding:.2rem .7rem;border:var(--bw) solid var(--border);border-radius:999px;cursor:pointer;background:var(--surface)}
.chipsel:has(input:checked){border-color:var(--primary);background:var(--info-bg)}
.swatches{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.swatch{width:44px;height:44px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 var(--bw) var(--border);cursor:pointer}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--text)}
.emoji-pick{font-size:1.4rem;width:48px;height:48px;border-radius:var(--radius-s);border:var(--bw) solid var(--border);background:var(--surface);cursor:pointer}
.emoji-pick[aria-pressed="true"]{border:3px solid var(--primary);background:var(--info-bg)}
.time-row{display:flex;gap:.4rem;align-items:center;margin-bottom:.4rem}
.time-row input{max-width:10rem}
.err{background:var(--danger-bg);color:var(--danger);border:var(--bw) solid var(--danger);border-radius:var(--radius-s);padding:.6rem .8rem;margin-bottom:.8rem;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.86rem}

/* =========================================================
   5. BANNERS, CHIPS, TOAST
   ========================================================= */
.banner{display:flex;gap:.7rem;align-items:flex-start;padding:.75rem .9rem;border-radius:var(--radius-s);margin-bottom:.6rem;border:var(--bw) solid;animation:fade .2s}
.banner .b-body{flex:1}
@media (max-width:620px){.banner{flex-wrap:wrap}.banner .b-body{flex:1 1 calc(100% - 3rem)}.banner>.btn,.banner>.btn-row{margin-left:2.2rem}}
.banner.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--text)}
.banner.warn>.ic{color:var(--warn)}
.banner.info{background:var(--info-bg);border-color:var(--primary)}
.banner.danger{background:var(--danger-bg);border-color:var(--danger)}
.banner.ok{background:var(--ok-bg);border-color:var(--ok)}
.chip{display:inline-flex;align-items:center;gap:.25rem;font-size:.78rem;font-weight:700;padding:.1rem .55rem;border-radius:999px;background:var(--surface-2);border:var(--bw) solid var(--border);color:var(--muted)}
.chip.taken{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.chip.late{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.chip.missed,.chip.skipped{background:var(--danger-bg);color:var(--danger);border-color:var(--danger)}
.chip.due{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.chip.snoozed{background:var(--info-bg);color:var(--primary);border-color:var(--primary)}
.chip.low{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));z-index:200;display:flex;flex-direction:column;gap:.4rem;width:min(92vw,460px);pointer-events:none}
@media(min-width:900px){#toasts{bottom:1.5rem}}
.toast{background:var(--text);color:var(--bg);padding:.7rem 1rem;border-radius:var(--radius-s);box-shadow:var(--shadow);font-weight:600;animation:fade .2s;pointer-events:auto}

/* =========================================================
   6. VANDAAG — TIJDLIJN
   ========================================================= */
.today-grid{display:grid;gap:1rem}
.today-grid>*{min-width:0}
svg.chart.bp text{font-size:14px}
.nav-short{display:none}
@media (max-width:420px){.nav-long{display:none}.nav-short{display:inline}}
@media(min-width:900px){.today-grid.two{grid-template-columns:1fr 1fr}}
.pcol-head{display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem}
.pcol-head .pemoji{font-size:1.8rem}
.pcol-head h2{margin:0}
.progress{height:10px;border-radius:999px;background:var(--surface-2);border:var(--bw) solid var(--border);overflow:hidden;margin:.2rem 0 .8rem}
.progress>span{display:block;height:100%;background:var(--pc,var(--accent));transition:width .25s}
.timeline{list-style:none;margin:0;padding:0;position:relative}
.dose{display:grid;grid-template-columns:3.6rem 2.6rem 1fr;gap:.25rem .6rem;align-items:center;padding:.65rem .55rem;border-radius:var(--radius-s);border:var(--bw) solid var(--border);margin-bottom:.5rem;background:var(--surface);border-left:6px solid var(--mc);transition:background .2s}
.dose-time{font-weight:800;font-size:1.05rem;font-variant-numeric:tabular-nums}
.dose-icon{width:2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center;font-size:1.25rem;background:color-mix(in srgb,var(--mc) 18%,transparent)}
.dose-name{font-weight:700}
.dose-name .str{font-weight:500;color:var(--muted)}
.dose-meta{font-size:.86rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:.2rem .6rem;align-items:center}
.dose-actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.25rem}
@media(min-width:620px){.dose{grid-template-columns:3.6rem 2.6rem 1fr auto}.dose-actions{grid-column:auto;margin-top:0;justify-content:flex-end}}
.dose.st-due{background:var(--info-bg);border-color:var(--primary)}
.dose.st-missed{background:var(--danger-bg)}
.dose.st-taken,.dose.st-late,.dose.st-skipped{opacity:.85}
.dose.st-na{opacity:.6}
.empty{padding:1.2rem;text-align:center;color:var(--muted);border:2px dashed var(--border);border-radius:var(--radius-s)}
.attn{border-color:var(--danger)}
.attn-item{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between;padding:.55rem 0;border-bottom:var(--bw) solid var(--border)}
.attn-item:last-child{border-bottom:0}

/* =========================================================
   7. MEDICIJNEN, VOORRAAD, TABELLEN
   ========================================================= */
.med-list{display:grid;gap:1rem}
@media(min-width:900px){.med-list{grid-template-columns:1fr 1fr}}
.med-card{border-left:6px solid var(--mc)}
.med-head{display:flex;gap:.7rem;align-items:flex-start}
.med-head .dose-icon{flex:none}
.med-title{font-weight:800;font-size:1.1rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.15rem .8rem;margin:.6rem 0;font-size:.92rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:.5rem .45rem;border-bottom:var(--bw) solid var(--border);vertical-align:top}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.bar{height:12px;border-radius:999px;background:var(--surface-2);border:var(--bw) solid var(--border);overflow:hidden;min-width:80px}
.bar>span{display:block;height:100%;background:var(--ok)}
.stat-row{display:flex;flex-wrap:wrap;gap:.8rem;margin-bottom:.8rem}
.stat{flex:1;min-width:120px;background:var(--surface-2);border:var(--bw) solid var(--border);border-radius:var(--radius-s);padding:.7rem}
.stat b{display:block;font-size:1.6rem;line-height:1.1}
.stat span{font-size:.82rem;color:var(--muted)}
.sound-bar{max-width:1180px;margin:.8rem auto 0;padding:0 1rem}
.sound-bar .btn{width:100%;min-height:52px}
.notif-pill{display:inline-flex;align-items:center;gap:.35rem;min-height:44px;padding:.25rem .8rem;border-radius:999px;border:2px solid;font:inherit;font-weight:700;font-size:.9rem;cursor:pointer;background:var(--surface)}
.sync-pill{position:relative;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none;border-radius:var(--radius-s);border:var(--bw) solid var(--border);background:var(--surface);color:var(--text);cursor:pointer}
.sync-pill .sd,.sync-dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--muted)}
.sync-pill .sd{position:absolute;right:4px;bottom:4px;border:2px solid var(--surface)}
.sync-pill.ok .sd,.sync-dot.ok{background:var(--ok)} .sync-pill.busy .sd,.sync-dot.busy{background:var(--primary)} .sync-pill.offline .sd,.sync-dot.offline{background:var(--warn)} .sync-pill.error .sd,.sync-dot.error{background:var(--danger)}
.sync-pill.busy svg{animation:spin 1.2s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}
.notif-pill.on{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.notif-pill.off{color:var(--danger);border-color:var(--danger);background:var(--danger-bg)}
.np-dot{width:10px;height:10px;border-radius:50%;background:currentColor}
@media (max-width:899px){.topbar .np-text{display:none}.topbar .notif-pill{padding:.25rem .55rem}}
.bp-last{display:flex;flex-wrap:wrap;gap:.4rem 1.1rem;align-items:center;margin:.3rem 0 .8rem}
.bp-big{font-size:2.3rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.bp-big small{font-size:.85rem;font-weight:500;color:var(--muted)}
#bp-prev{white-space:pre-line}
.order-col h3{display:flex;align-items:center;gap:.4rem}
.order-item{display:flex;flex-wrap:wrap;gap:.4rem .8rem;align-items:center;justify-content:space-between;padding:.55rem 0;border-bottom:var(--bw) solid var(--border)}
.order-item:last-child{border-bottom:0}

/* =========================================================
   8. HEATMAP
   ========================================================= */
.heatmap{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;overflow-x:auto;padding-bottom:.3rem}
.hm-labels{display:grid;grid-template-rows:repeat(7,1fr);gap:4px;font-size:.7rem;color:var(--muted)}
.hm-wrap{display:flex;gap:6px}
.hm{width:20px;height:20px;border-radius:4px;background:var(--hm-none)}
.hm.ok{background:var(--hm-ok)} .hm.late{background:var(--hm-late)} .hm.miss{background:var(--hm-miss)} .hm.future{background:transparent;border:1px dashed var(--border)}
.hm.today{outline:2px solid var(--text);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:.8rem;font-size:.82rem;margin-top:.5rem}
.legend span{display:inline-flex;align-items:center;gap:.3rem}

/* =========================================================

const STORE_KEY = 'medicatie-reminder.v1';
const APP_VERSION = '1.5.0';
const HELP_MD = "# Medicatie-reminder — Help\n\nEen offline app die voor **twee personen** bijhoudt welke medicijnen wanneer genomen moeten worden, herinneringen geeft, de voorraad aftelt en helpt bij het aanvragen van herhaalrecepten. Alle gegevens blijven op uw eigen apparaat.\n\n> Deze app is een hulpmiddel en vervangt geen advies van huisarts of apotheek. Controleer de medicatielijst regelmatig met uw apotheek.\n\n## 1. Starten\n**Via het vaste webadres (aanbevolen, vooral op de telefoon):** open het adres van uw app op GitHub Pages in Chrome. Op de telefoon tikt u op de drie puntjes → **App installeren** (of *Toevoegen aan startscherm*). Het icoontje blijft dan altijd werken, ook zonder internet, en nieuwe versies komen vanzelf binnen.\n\n**Als los bestand:**\n1. Zet `medicatie-reminder.html` in een vaste map, bijvoorbeeld *Documenten*.\n2. Dubbelklik op het bestand; het opent in Chrome. Tip: maak er een bladwijzer van (ster in de adresbalk).\n3. Klik één keer ergens in de app (of op de blauwe balk **Klik hier om het geluid aan te zetten**). Browsers spelen pas geluid nadat u één keer in een pagina hebt geklikt.\n\n## 2. Hoe de herinneringen werken\n- Op het tijdstip klinkt een **geluid**, verschijnt een **venster in de app** en **knippert de naam** van het tabblad op de taakbalk: *⏰ Medicijn innemen!*\n- Het geluid **herhaalt elke minuut** tot u op *Ingenomen*, *Overgeslagen* of *Later* klikt (standaard maximaal 30 minuten; aan te passen in *Instellingen → Herinneringen*).\n- Laat Chrome open staan met de app in een tabblad; u kunt gewoon in andere programma's werken. Zet het geluid van de computer niet uit.\n- Is Chrome helemaal dicht of slaapt de computer, dan komt er op dat moment geen herinnering. Bij het weer openen ziet u gemiste innames onder **Aandacht nodig**.\n- Meldingen rechtsonder in beeld (van Windows) zijn niet mogelijk als de app als bestand wordt geopend; dat staat Chrome niet toe.\n\n## 3. Profielen\n- Bovenin staan twee tabbladen, één per persoon. Klik erop om te wisselen (of gebruik de pijltjestoetsen).\n- Met het potlood-knopje naast de tabbladen vult u naam, geboortedatum, emoji, kleur, **huisarts**, **apotheek** en notities (allergieën, dieet, verzekering) in.\n- De gegevens van de twee personen staan volledig los van elkaar.\n\n## 4. Vandaag\n- Per persoon een tijdlijn van de innames van vandaag, met de knoppen **Ingenomen**, **Overslaan** en **Later** (uitstellen).\n- Met *Toon beide personen* ziet u beide tijdlijnen tegelijk.\n- **Aandacht nodig** toont gemiste innames van gisteren en vandaag. Kies *Was op tijd* (vergeten te loggen), *Nu ingenomen* of *Overgeslagen*.\n- Medicijnen \"zo nodig\" staan onderaan; klik *Nu ingenomen* om een inname vast te leggen.\n- Waarschuwingen over bijna lege voorraad, bestellingen en backups verschijnen bovenaan.\n\n## 5. Herinnering op het moment zelf\nOp het ingestelde tijdstip krijgt u een geluid, trilling (telefoon), een venster in de app en een melding van de browser. In het venster kiest u:\n- **Ingenomen** — de voorraad wordt automatisch afgeteld.\n- **Overgeslagen**\n- **Later** of **5 / 10 / 15 / 30 min** — u krijgt dan opnieuw een herinnering. Elke uitstel wordt gelogd.\n\n**Te laat ingenomen?** In *Instellingen → Herinneringen* kiest u bij *Marge voor \"te laat ingenomen\"* hoeveel speling u wilt (15 minuten tot 6 uur), of *Nooit \"te laat\" tonen*. De marge geldt meteen ook voor eerdere registraties. Apart stelt u in na hoeveel tijd een niet-afgevinkte inname als *gemist* onder *Aandacht nodig* komt.\n\n## 6. Medicijnen\nKlik op **Medicijn toevoegen**. Begin met typen bij *Naam*; bekende medicijnen worden voorgesteld en vullen sterkte en vorm alvast in. Schema's:\n- **Dagelijks op vaste tijden**\n- **Zo nodig** — geen herinnering, wel loggen\n- **Kuur** — met start- en einddatum\n- **Om de dag** — vanaf de startdatum\n- **Specifieke weekdagen** — bijvoorbeeld alleen maandag\n- **Interval** — bijvoorbeeld elke 8 uur vanaf 06:00\n\nVerder: aantal per keer, met/zonder eten, voorraad en drempel, herhaalrecept, kleur, icoon en een notitie (zoals \"niet met grapefruit\").\n\n## 7. Voorraad en bestellen\n- Bij elke inname telt de voorraad af. Onder de drempel, of als er minder dan het ingestelde aantal dagen (standaard 5) over is, verschijnt een waarschuwing.\n- **Markeer als besteld** zet de status op *Besteld* en berekent de verwachte leverdatum.\n- **Opgehaald** vraagt hoeveel u heeft gekregen en telt dit bij de voorraad op.\n- **Historie** toont een grafiek en tabel van het verloop van de voorraad.\n- In *Instellingen → Voorraad* zet u een vaste **bestelherinnering** aan, bijvoorbeeld elke woensdag om 19:00.\n\n## 8. Recept aanvragen bij de huisarts\n- Klik bij een medicijn op **Recept aanvragen**. U ziet het bericht vooraf en kunt het nog aanpassen.\n- **Openen in Gmail** opent een nieuw Gmail-bericht aan het e-mailadres van de huisarts van die persoon.\n- **Mailprogramma** gebruikt uw standaard mailprogramma (mailto).\n- **Kopiëren** zet de tekst op het klembord om zelf te plakken.\n- De tekst stelt u in bij *Instellingen → E-mail*. Beschikbare invulvelden: `{patiëntnaam}` `{geboortedatum}` `{medicijnnaam}` `{sterkte}` `{dosering}` `{huisartsnaam}` `{apotheeknaam}` `{datum}`.\n- Elke aanvraag wordt bewaard in het logboek.\n\n## 9. Info\nHet tabblad **Info** geeft per medicijn een korte uitleg: hoe het werkt, waarvoor het is en de meest voorkomende bijwerkingen. De informatie is algemeen en beknopt; lees altijd de bijsluiter of kijk op apotheek.nl.\n\n## 10. Bloeddruk en hartslag\nOp het tabblad **Bloeddruk** houdt u voor beide personen de maandelijkse meting bij.\n- Klik op **Meting toevoegen**, kies de persoon en vul bovendruk, onderdruk en (liefst) hartslag in. Datum en tijd staan al op nu.\n- De app geeft direct een **automatische beoordeling** (optimaal, normaal, hoog-normaal, verhoogd, hoog, zeer hoog of laag) en vergelijkt met de **streefwaarde** van die persoon (standaard onder 140/90; aan te passen met *Aanpassen*, bijvoorbeeld naar wat de huisarts heeft afgesproken).\n- In het veld **Eigen beoordeling / opmerking** schrijft u uw eigen korte beoordeling, bijvoorbeeld \"gemeten na wandeling\".\n- Per persoon ziet u de laatste meting, een grafiek en de lijst met metingen. Met het potlood of de prullenbak past u een meting aan of verwijdert u die.\n- **Maandelijkse herinnering**: in *Instellingen → Bloeddruk-herinnering* kiest u de dag van de maand en de tijd. U krijgt alleen een herinnering als iemand die maand nog niet gemeten heeft; op *Vandaag* staat dan ook een melding.\n- **Rapport printen**: kies persoon (of beiden), periode en eventueel een algemene beoordeling. Het rapport bevat gemiddelden, hoogste en laagste waarde, verloop, een grafiek, een overzicht per maand en alle metingen met beoordeling en opmerking.\n- De metingen staan ook in het **Logboek** en in de CSV-export.\n\nGoed meten: 5 minuten rustig zitten, arm op tafel op hartshoogte, niet direct na koffie, roken, eten of inspanning, en steeds dezelfde arm. De beoordeling is een algemene indicatie, geen diagnose.\n\n## 11. Logboek\n- Kies persoon, medicijn en periode (7, 30 of 90 dagen).\n- U ziet de bloeddrukmetingen van die periode, het percentage op tijd/ingenomen per medicijn, een kalender (groen = ingenomen, oranje = te laat, rood = gemist of overgeslagen) en de volledige lijst.\n- Verkeerd gelogd? Gebruik de prullenbak in de lijst; de voorraad wordt dan hersteld.\n- **Printen**: medicatielijst (handig voor de dokter) en een rapport.\n\n## 12. Backup\n- *Instellingen → Gegevens*: **Backup downloaden (JSON)** en **Backup terugzetten**.\n- De app herinnert u eraan om regelmatig (standaard wekelijks) een backup te maken.\n- Let op: de gegevens staan in de browser. Wist u de browsergegevens, dan zijn ze weg — maak dus backups.\n- **CSV** exporteert het logboek voor Excel.\n\n## 13. Weergave en toegankelijkheid\nIn *Instellingen → Weergave*: groot lettertype, hoog contrast en licht/donker thema (standaard volgt de app uw computer). Alles is met het toetsenbord te bedienen: **Tab** om te verspringen, **Enter/Spatie** om te kiezen, **Esc** sluit een venster.\n\n## 14. Testen\n1. Voeg een medicijn toe met een tijdstip **1 minuut** na nu.\n2. Laat de app open. Binnen een minuut na dat tijdstip klinkt een toon en verschijnt de herinnering.\n3. Kies *5 min* en controleer in *Logboek → Uitstel-geschiedenis* dat het is vastgelegd.\n4. Kies daarna *Ingenomen* en controleer dat de voorraad is afgenomen.\n5. In *Instellingen* staan knoppen voor een test-melding, een test-bestelherinnering en een test-bloeddrukherinnering.\n6. Voer op *Bloeddruk* een meting in en kies *Rapport printen*.\n\n## 15. Synchroniseren tussen PC en telefoon\nMet synchroniseren gebruikt u de app op de PC én op de telefoon met dezelfde gegevens. Wat u op het ene toestel afvinkt of wijzigt, staat binnen een minuut ook op het andere.\n\n**Eenmalig instellen (eerst op de PC):**\n1. Ga naar *Instellingen → Synchroniseren* en klik op **Instellen**.\n2. Klik op de link om bij GitHub een sleutel te maken. Kies bij *Expiration* **No expiration**, laat alleen het vakje **gist** aangevinkt en klik op **Generate token**.\n3. Kopieer de sleutel (begint met `ghp_`) en plak die in de app.\n4. Kies een **codewoord** van minstens 8 tekens en schrijf het op. Zonder dit codewoord zijn de gegevens in GitHub niet te lezen, ook niet door uzelf.\n5. Klik op **Verbinden**.\n\n**Daarna op de telefoon:**\n1. Zet `medicatie-reminder.html` op de telefoon (bijvoorbeeld via WhatsApp of Mijn Berichten naar uzelf sturen) en open het in Chrome.\n2. Klik op de PC bij *Instellingen → Synchroniseren* op **Koppelcode kopiëren** en stuur die code naar de telefoon.\n3. Ga op de telefoon naar *Instellingen → Synchroniseren → Instellen* en plak de code in het vakje **Koppelcode**. Klik op **Verbinden**.\n4. De gegevens van de PC verschijnen nu ook op de telefoon.\n\n**Goed om te weten:**\n- Het wolkje bovenin toont de status: groen = bijgewerkt, blauw = bezig, oranje = geen internet, rood = probleem. Klik erop voor details of om meteen te synchroniseren.\n- Zonder internet werkt de app gewoon door; wijzigingen worden verstuurd zodra er weer verbinding is.\n- De gegevens staan versleuteld in een **geheime gist** op uw eigen GitHub-account.\n- Herinneringen met geluid werken op de telefoon alleen als de app open op het scherm staat. Wat u op de telefoon afvinkt, stopt de herinnering op de PC.\n- Weergave-instellingen (thema, groot lettertype, contrast, geluid) blijven per toestel apart.\n- Raakt de telefoon de gegevens kwijt, stel de synchronisatie dan opnieuw in: alles komt terug.\n- Een backup terugzetten wordt samengevoegd met wat al in GitHub staat.\n\n## 16. Privacy\nGeen account bij ons, geen tracking. Zonder synchronisatie maakt de app geen verbinding met internet (alleen als u zelf op *Openen in Gmail* klikt). Met synchronisatie gaan uw gegevens **versleuteld** naar uw eigen GitHub-account; sleutel en codewoord blijven op uw eigen toestellen.\n";

/* --- Versleuteling --- */
const b64 = buf => { let s = ''; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };

/* --- GitHub --- */
async function gh(path, opts = {}, token = syncCfg && syncCfg.token) {
  let r;

  catch (e) { throw Object.assign(new Error('Geen verbinding met internet'), { code: 'offline' }); }
  if (r.status === 401) throw Object.assign(new Error('De GitHub-sleutel is ongeldig of verlopen'), { code: 'auth' });
  if (r.status === 403) throw Object.assign(new Error('GitHub weigert de toegang. Is bij het maken van de sleutel het vakje "gist" aangevinkt?'), { code: 'auth' });
  if (r.status === 404) throw Object.assign(new Error('De opslag in GitHub is niet gevonden (verwijderd?)'), { code: '404' });
  if (!r.ok) throw Object.assign(new Error('GitHub gaf een foutmelding (' + r.status + ')'), { code: 'http' });

/* --- De synchronisatie zelf --- */
function syncNow(manual = false) {

  syncSt.promise = (async () => {
    try {
      const g = await gh('/gists/' + syncCfg.gistId);
      const txt = await gistContent(g);
      let remote = null;
      if (txt && txt.trim()) { const r = await decryptState(txt, syncCfg.pass); remote = r.data; syncCfg.salt = r.salt; }
      if (!syncCfg) return; // intussen ontkoppeld
      const merged = remote ? mergeState(state, remote, syncCfg.adopt) : state;
      const mergedJson = canon(sharedPart(merged));
      if (mergedJson !== canon(sharedPart(state))) {
        if (dialogOpen()) syncSt.pending = true; // niet onder een open venster wisselen; na sluiten opnieuw
        else { state = merged; save(true); afterRemoteChange(); }
      }
      if (!remote || canon(remote) !== mergedJson) {
        const content = await encryptState(sharedPart(merged), syncCfg.pass, syncCfg.salt);
        await gh('/gists/' + syncCfg.gistId, { method: 'PATCH', body: JSON.stringify({ files: { [GIST_FILE]: { content } } }) });
        syncCfg.salt = JSON.parse(content).salt;
      }
      if (!syncSt.pending) syncCfg.adopt = false;
      syncCfg.lastSync = isoLocal(new Date()); saveSyncCfg();
      syncSt.lastJson = canon(sharedPart(state));
      setSync('ok', '');
      if (manual) toast('Gesynchroniseerd.');
    } catch (e) {
      setSync(e.code === 'offline' ? 'offline' : 'error', e.message);
      if (manual) toast(e.message + '.');

      if (syncSt.again) { syncSt.again = false; scheduleSync(800); }

async function connectSync(token, pass) {
  if (!cryptoOk()) throw new Error('Deze browser ondersteunt de versleuteling niet. Open de app in Google Chrome');
  await gh('/user', {}, token);
  let found = null;
  for (let page = 1; page <= 10 && !found; page++) {
    const list = await gh(`/gists?per_page=100&page=${page}`, {}, token);
    if (!list || !list.length) break;
    found = list.find(g => g.files && g.files[GIST_FILE]);

    const full = await gh('/gists/' + found.id, {}, token);

function stockChart(m) {
  const h = m.stock.history.slice(-80); if (h.length < 2) return '<p class="muted">Nog te weinig gegevens voor een grafiek.</p>';
  const W = 640, H = 220, L = 40, R = 10, T = 10, B = 28;
  const t0 = new Date(h[0].ts).getTime(), t1 = new Date(h[h.length - 1].ts).getTime() || t0 + 1;
  const vmax = Math.max(...h.map(x => x.value), +m.stock.threshold || 0, 1);
  const X = t => L + (t1 === t0 ? 0 : (t - t0) / (t1 - t0)) * (W - L - R), Y = v => T + (1 - v / vmax) * (H - T - B);
  let path = ''; h.forEach((x, i) => { const px = X(new Date(x.ts).getTime()), py = Y(x.value); path += i ? ` H${px.toFixed(1)} V${py.toFixed(1)}` : `M${px.toFixed(1)} ${py.toFixed(1)}`; });
  const thrY = Y(+m.stock.threshold || 0);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Voorraadverloop ${esc(m.name)}: van ${fmtNum(h[0].value)} op ${fmtDate(h[0].ts)} naar ${fmtNum(h[h.length - 1].value)} op ${fmtDate(h[h.length - 1].ts)}">
   <line x1="${L}" y1="${T}" x2="${L}" y2="${H - B}" stroke="currentColor" opacity=".3"/><line x1="${L}" y1="${H - B}" x2="${W - R}" y2="${H - B}" stroke="currentColor" opacity=".3"/>
   <text x="${L - 6}" y="${T + 10}" text-anchor="end">${fmtNum(vmax)}</text><text x="${L - 6}" y="${H - B}" text-anchor="end">0</text>
   <line x1="${L}" y1="${thrY}" x2="${W - R}" y2="${thrY}" stroke="var(--warn)" stroke-dasharray="6 4"/><text x="${W - R}" y="${thrY - 4}" text-anchor="end">drempel</text>
   <path d="${path}" fill="none" stroke="${esc(m.color)}" stroke-width="3"/>
   <text x="${L}" y="${H - 8}">${fmtDate(h[0].ts)}</text><text x="${W - R}" y="${H - 8}" text-anchor="end">${fmtDate(h[h.length - 1].ts)}</text></svg>`;
}
function historyDialog(pid, mid) {

function collectDoses(p, meds, days, now = new Date()) {
  const idx = logIndex(p), out = [];
  for (let i = days - 1; i >= 0; i--) { const ds = ymd(addDays(now, -i)); for (const m of meds) for (const t of doseTimes(m, ds)) { const d = mkDose(p, m, ds, t); out.push({ ...d, ...doseState(d, idx, now) }); } }
  return out;
}
function stats(list) { const c = { taken: 0, late: 0, skipped: 0, missed: 0 }; list.forEach(d => { if (d.st in c) c[d.st]++; }); const total = c.taken + c.late + c.skipped + c.missed; return { ...c, total, pct: total ? Math.round((c.taken + c.late) / total * 100) : null, onTime: total ? Math.round(c.taken / total * 100) : null }; }
function logProfiles() { return ui.log.profile === 'both' ? state.profiles : [ui.log.profile === 'active' ? AP() : (P(ui.log.profile) || AP())]; }
function filteredMeds(p) { return ui.log.med === 'all' ? p.medications : p.medications.filter(m => m.id === ui.log.med); }
function heatmapHtml(profiles) {
  const now = new Date(); const days = 91; const start = addDays(now, -(days - 1)); const startMon = addDays(start, -(dow(start) - 1));
  const per = {};
  for (const p of profiles) collectDoses(p, filteredMeds(p), days + 7, now).forEach(d => { (per[d.ds] = per[d.ds] || []).push(d.st); });
  let cells = '';
  for (let d = new Date(startMon); d <= addDays(now, 7 - dow(now)); d = addDays(d, 1)) {
    const ds = ymd(d); const s = per[ds] || [];
    let cls = 'none', txt = 'geen innames';
    if (d > now) { cls = 'future'; txt = 'toekomst'; }
    else if (d < start) { cls = 'future'; txt = ''; }
    else if (s.some(x => x === 'missed' || x === 'skipped')) { cls = 'miss'; txt = 'gemist of overgeslagen'; }
    else if (s.some(x => x === 'late')) { cls = 'late'; txt = 'te laat ingenomen'; }
    else if (s.some(x => x === 'taken')) { cls = 'ok'; txt = 'alles ingenomen'; }
    cells += `<div class="hm ${cls} ${ds === ymd(now) ? 'today' : ''}" title="${fmtDate(d)}: ${txt}"></div>`;
  }
  return `<div class="hm-wrap" role="img" aria-label="Kalender laatste 13 weken. Groen alles ingenomen, oranje te laat, rood gemist. Zie de tabel hieronder voor details."><div class="hm-labels" aria-hidden="true">${DAYS.map(d => `<span>${d}</span>`).join('')}</div><div class="heatmap">${cells}</div></div>
  <div class="legend" aria-hidden="true"><span><i style="background:var(--hm-ok)"></i>Ingenomen</span><span><i style="background:var(--hm-late)"></i>Te laat</span><span><i style="background:var(--hm-miss)"></i>Gemist / overgeslagen</span><span><i style="background:var(--hm-none)"></i>Geen innames</span></div>`;
}

/* =========================================================
   JS 17. HELP (eenvoudige markdown-weergave)
   ========================================================= */
function mdToHtml(md) {
  const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\*([^*]+)\*/g, '<i>$1</i>');
  const lines = md.split(/\r?\n/); let html = '', list = null, code = false, para = [];
  const flushP = () => { if (para.length) { html += `<p>${inline(para.join(' '))}</p>`; para = []; } };
  const flushL = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const ln of lines) {
    if (ln.startsWith('```')) { flushP(); flushL(); html += code ? '</code></pre>' : '<pre><code>'; code = !code; continue; }
    if (code) { html += esc(ln) + '\n'; continue; }
    let m;
    if ((m = ln.match(/^(#{1,3})\s+(.*)/))) { flushP(); flushL(); const n = m[1].length + 1; html += `<h${n}>${inline(m[2])}</h${n}>`; }
    else if ((m = ln.match(/^\s*[-*]\s+(.*)/))) { flushP(); if (list !== 'ul') { flushL(); html += '<ul>'; list = 'ul'; } html += `<li>${inline(m[1])}</li>`; }
    else if ((m = ln.match(/^\s*\d+\.\s+(.*)/))) { flushP(); if (list !== 'ol') { flushL(); html += '<ol>'; list = 'ol'; } html += `<li>${inline(m[1])}</li>`; }
    else if ((m = ln.match(/^>\s?(.*)/))) { flushP(); flushL(); html += `<blockquote>${inline(m[1])}</blockquote>`; }
    else if (!ln.trim()) { flushP(); flushL(); }
    else { flushL(); para.push(ln.trim()); }
  }
  flushP(); flushL(); return html;
}

   JS 20. PWA: SERVICE WORKER, MANIFEST-FALLBACK, INSTALLATIE
   ========================================================= */
function setupPwa() {
  const isHttp = /^https?:$/.test(location.protocol);
  if (isHttp) {
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    fetch('manifest.json', { cache: 'no-store' }).then(r => { if (!r.ok) throw 0; }).catch(() => {
      const man = { name: 'Medicatie-reminder', short_name: 'Medicatie', lang: 'nl', start_url: location.href.split('#')[0], scope: location.href.replace(/[^/]*$/, ''), display: 'standalone', background_color: '#edf3f7', theme_color: '#1b6aa0', icons: [{ src: APP_ICON, sizes: 'any', type: 'image/svg+xml', purpose: 'any maskable' }] };
      $('#manifest-link').href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(man));
    });
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').then(r => { swReg = r; }).catch(() => {});
      navigator.serviceWorker.addEventListener('message', e => {
        const m = e.data || {}; if (m.type !== 'notif-action' || !m.doseKey) return;
        if (m.action === 'taken') { const d = parseKey(m.doseKey); if (d && !logIndex(d.p).has(d.key)) { logDose(d.p, d.med, d, 'taken'); render(true); toast(`${d.med.name} ingenomen.`); } }
        else if (m.action === 'snooze') { snoozeDose(m.doseKey, +S().snoozeDefault || 10); render(true); }
        else { openAlerts.add(m.doseKey); showAlertDialog(); }
      });
    }
  } else { $('#manifest-link').remove(); }
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; $('#btn-install').hidden = false; const b2 = $('#btn-install-2'); if (b2) b2.hidden = false; });
  window.addEventListener('appinstalled', () => { deferredInstall = null; $('#btn-install').hidden = true; toast('App geïnstalleerd.'); });
}
function handleUrlAction() {
  const u = new URL(location.href); const key = u.searchParams.get('dose'), act = u.searchParams.get('action');
  if (!key) return; history.replaceState(null, '', u.pathname);
  const d = parseKey(key); if (!d || logIndex(d.p).has(d.key)) return;
  if (act === 'taken') logDose(d.p, d.med, d, 'taken'); else if (act === 'snooze') snoozeDose(key, +S().snoozeDefault || 10); else { openAlerts.add(key); setTimeout(showAlertDialog, 300); }
}

const BPC = { sys: '#d9534f', dia: '#2f80c2', pulse: '#1d9a6c' };
const CHIP = { ok: 'taken', warn: 'late', danger: 'missed' };
const LVL = { ok: 0, warn: 1, danger: 2 };
const BP_CLASSES = [

  { key: 'g2', label: 'Hoog (graad 2)', lvl: 'danger', test: (s, d) => s >= 160 || d >= 100 },
  { key: 'g1', label: 'Verhoogd (graad 1)', lvl: 'warn', test: (s, d) => s >= 140 || d >= 90 },
  { key: 'low', label: 'Laag', lvl: 'warn', test: (s, d) => s < 90 || d < 60 },
  { key: 'hn', label: 'Hoog-normaal', lvl: 'ok', test: (s, d) => s >= 130 || d >= 85 },
  { key: 'n', label: 'Normaal', lvl: 'ok', test: (s, d) => s >= 120 || d >= 80 },
  { key: 'opt', label: 'Optimaal', lvl: 'ok', test: () => true }
];
const addMonths = (d, n) => { const x = new Date(d); x.setMonth(x.getMonth() + n); return x; };
const bpClass = (s, d) => BP_CLASSES.find(c => c.test(+s, +d));

const bpTarget = p => ({ sys: +(p.bpTarget && p.bpTarget.sys) || 140, dia: +(p.bpTarget && p.bpTarget.dia) || 90 });
const aboveTarget = (p, s, d) => { const t = bpTarget(p); return s >= t.sys || d >= t.dia; };
const thisMonthDone = p => { const ym = ymd(new Date()).slice(0, 7); return (p.measurements || []).some(m => m.ts.slice(0, 7) === ym); };
const bpSortAsc = (a, b) => a.ts.localeCompare(b.ts);
function bpAssess(p, m) {
  const c = bpClass(m.sys, m.dia), pc = pulseClass(+m.pulse), t = bpTarget(p), above = aboveTarget(p, +m.sys, +m.dia);

  if (pc) parts.push('hartslag ' + pc.label);
  let advice = '';

  else if (c.key === 'low') advice = 'Heeft u last van duizeligheid of bijna flauwvallen? Overleg dan met de huisarts.';
  let lvl = c.lvl;

function bpSummary(p, list) {

  const s = avg('sys'), d = avg('dia'), pu = avg('pulse');

function bpChart(p, list, forPrint = false) {

   ${line('pulse', BPC.pulse, true)}${line('dia', BPC.dia)}${line('sys', BPC.sys)}
   <text x="${L}" y="${H - 8}">${fmtDate(h[0].ts)}</text><text x="${W - R}" y="${H - 8}" text-anchor="end">${fmtDate(h[h.length - 1].ts)}</text></svg>`;

   ${last ? `<div class="bp-last"><div class="bp-big" aria-label="Laatste meting ${last.sys} over ${last.dia}">${last.sys}/${last.dia}<small> mmHg</small></div>
     <div>${last.pulse ? `<b>${last.pulse}</b> slagen/min · ` : ''}${fmtDT(last.ts)}<br><span class="chip ${CHIP[a.lvl]}">${esc(a.cls.label)}</span> <span class="small muted">${esc(a.detail)}</span>
     ${a.advice ? `<div class="small" style="color:var(--danger);margin-top:.3rem;font-weight:600">${esc(a.advice)}</div>` : ''}</div></div>` : '<div class="empty">Nog geen metingen.</div>'}
   ${list.length ? bpChart(p, list) + (list.length >= 2 ? bpLegend() : '') : ''}
   ${list.length ? `<h3 style="margin-top:1rem">Metingen (${list.length})</h3><div class="table-wrap"><table><thead><tr><th scope="col">Datum</th><th scope="col">Bloeddruk</th><th scope="col">Hartslag</th><th scope="col">Beoordeling</th><th scope="col"><span class="sr-only">Acties</span></th></tr></thead><tbody>${list.slice(0, 24).map(m => bpRow(p, m, true)).join('')}</tbody></table></div>${list.length > 24 ? '<p class="muted small">De laatste 24 metingen worden getoond; het rapport bevat alles.</p>' : ''}` : ''}
  </section>`;
}
function viewBp() {
  return `<div class="view-head"><h1 id="view-title" tabindex="-1">Bloeddruk & hartslag</h1><span class="spacer"></span>
   <button type="button" class="btn" data-act="printBp">${ic('print', 18)} Rapport printen</button>
   <button type="button" class="btn primary big" data-act="addBp" data-p="${state.activeProfile}">${ic('plus')} Meting toevoegen</button></div>
   ${bpBanner(true)}
   <div class="today-grid two">${state.profiles.map(bpCard).join('')}</div>
   <details class="lib"><summary>${ic('info', 18)} Hoe wordt een meting beoordeeld? En hoe meet ik goed?</summary><div class="lib-body">
    <div class="table-wrap"><table><thead><tr><th scope="col">Indeling</th><th scope="col">Bovendruk</th><th scope="col"></th><th scope="col">Onderdruk</th></tr></thead><tbody>
     <tr><td>Optimaal</td><td>onder 120</td><td>en</td><td>onder 80</td></tr><tr><td>Normaal</td><td>120 – 129</td><td>of</td><td>80 – 84</td></tr>
     <tr><td>Hoog-normaal</td><td>130 – 139</td><td>of</td><td>85 – 89</td></tr><tr><td>Verhoogd (graad 1)</td><td>140 – 159</td><td>of</td><td>90 – 99</td></tr>
     <tr><td>Hoog (graad 2)</td><td>160 – 179</td><td>of</td><td>100 – 109</td></tr><tr><td>Zeer hoog (graad 3)</td><td>180 of hoger</td><td>of</td><td>110 of hoger</td></tr>
     <tr><td>Laag</td><td>onder 90</td><td>of</td><td>onder 60</td></tr></tbody></table></div>
    <p><b>Hartslag in rust:</b> 50 – 100 slagen per minuut geldt als normaal. Bij bètablokkers (zoals metoprolol of bisoprolol) is een lagere hartslag gebruikelijk.</p>
    <p><b>Streefwaarde:</b> standaard onder 140/90. Uw huisarts kan een andere streefwaarde afspreken (bij 80-plussers bijvoorbeeld vaak onder 150); pas die dan per persoon aan.</p>
    <p><b>Goed meten:</b> zit 5 minuten rustig met de rug tegen de leuning, voeten plat op de grond, arm ontspannen op tafel op hartshoogte. Niet meten vlak na koffie, roken, eten of inspanning. Meet bij voorkeur twee keer met een minuut ertussen en noteer het gemiddelde. Meet steeds aan dezelfde arm.</p>
    <p class="muted small">De beoordeling is een algemene indicatie en geen diagnose.</p></div></details>`;
}
function bpDialog(pid, mid) {
  const editing = mid ? P(pid).measurements.find(m => m.id === mid) : null;
  const m0 = editing || { ts: isoLocal(new Date()), sys: '', dia: '', pulse: '', arm: (P(pid).measurements.slice(-1)[0] || {}).arm || '', note: '' };
  const dt = new Date(m0.ts);
  openDialog({ title: editing ? 'Meting bewerken' : 'Bloeddrukmeting toevoegen',
    body: `<div id="bp-err" class="err" role="alert" hidden></div>
     ${editing ? `<p><b>${esc(P(pid).emoji)} ${esc(P(pid).name)}</b></p>` : `<div class="field"><label for="bp-p">Voor wie?</label><select id="bp-p">${state.profiles.map(p => `<option value="${p.id}" ${p.id === pid ? 'selected' : ''}>${esc(p.emoji)} ${esc(p.name)}</option>`).join('')}</select></div>`}
     <div class="fgrid c2"><div class="field"><label for="bp-d">Datum</label><input type="date" id="bp-d" value="${ymd(dt)}"></div><div class="field"><label for="bp-t">Tijd</label><input type="time" id="bp-t" value="${fmtTime(dt)}"></div></div>
     <div class="fgrid c3"><div class="field"><label for="bp-s">Bovendruk *</label><input type="number" id="bp-s" inputmode="numeric" min="50" max="280" value="${esc(m0.sys)}" aria-describedby="bp-u"></div>
      <div class="field"><label for="bp-dia">Onderdruk *</label><input type="number" id="bp-dia" inputmode="numeric" min="30" max="180" value="${esc(m0.dia)}" aria-describedby="bp-u"></div>
      <div class="field"><label for="bp-h">Hartslag</label><input type="number" id="bp-h" inputmode="numeric" min="25" max="250" value="${esc(m0.pulse)}" aria-describedby="bp-u"></div></div>
     <p class="hint small muted" id="bp-u">Bloeddruk in mmHg (zoals 135 en 82), hartslag in slagen per minuut.</p>
     <fieldset><legend>Arm</legend><div class="chips">${[['', 'Niet vermeld'], ['links', 'Links'], ['rechts', 'Rechts']].map(([v, l]) => `<label class="chipsel"><input type="radio" name="bp-arm" value="${v}" ${v === (m0.arm || '') ? 'checked' : ''}> ${l}</label>`).join('')}</div><p></p></fieldset>
     <div class="field"><span class="lbl">Automatische beoordeling</span><div class="preview" id="bp-prev" aria-live="polite">Vul bovendruk en onderdruk in.</div></div>
     <div class="field"><label for="bp-note">Eigen beoordeling / opmerking</label><textarea id="bp-note" rows="3" placeholder="bijv. gemeten na wandeling, voelde me goed">${esc(m0.note)}</textarea></div>`,
    actions: `<button type="button" class="btn" data-close>Annuleren</button><button type="button" class="btn primary" id="bp-save">${ic('check', 18)} Opslaan</button>`,
    onOpen: dlg => {
      const q = s => dlg.querySelector(s);
      const cur = () => P(editing ? pid : q('#bp-p').value);
      const num = s => parseInt(q(s).value, 10);
      const upd = () => { const s = num('#bp-s'), d = num('#bp-dia'), h = num('#bp-h');
        if (!(s >= 50 && d >= 30)) { q('#bp-prev').textContent = 'Vul bovendruk en onderdruk in.'; return; }
        const a = bpAssess(cur(), { sys: s, dia: d, pulse: h > 0 ? h : '' }); q('#bp-prev').textContent = a.text + (a.advice ? '\n' + a.advice : ''); };
      ['#bp-s', '#bp-dia', '#bp-h'].forEach(s => q(s).addEventListener('input', upd)); if (!editing) q('#bp-p').addEventListener('change', upd); upd();
      q('#bp-save').onclick = () => {
        dlg.querySelectorAll('[aria-invalid]').forEach(el => el.removeAttribute('aria-invalid'));
        const errs = []; let first = null; const bad = (sel, msg) => { errs.push(msg); q(sel).setAttribute('aria-invalid', 'true'); first = first || q(sel); };
        const s = num('#bp-s'), d = num('#bp-dia'), h = q('#bp-h').value.trim() ? num('#bp-h') : '';
        if (!q('#bp-d').value) bad('#bp-d', 'Vul een datum in.');
        if (!(s >= 50 && s <= 280)) bad('#bp-s', 'Bovendruk moet tussen 50 en 280 liggen.');
        if (!(d >= 30 && d <= 180)) bad('#bp-dia', 'Onderdruk moet tussen 30 en 180 liggen.');
        if (s && d && d >= s) bad('#bp-dia', 'De onderdruk moet lager zijn dan de bovendruk.');
        if (h !== '' && !(h >= 25 && h <= 250)) bad('#bp-h', 'Hartslag moet tussen 25 en 250 liggen (of leeg laten).');
        if (errs.length) { const b = q('#bp-err'); b.hidden = false; b.innerHTML = errs.map(esc).join('<br>'); first.focus(); return; }
        const p = cur();
        const rec = { id: editing ? editing.id : uid('bp'), ts: `${q('#bp-d').value}T${q('#bp-t').value || '12:00'}:00`, sys: s, dia: d, pulse: h, arm: (dlg.querySelector('input[name="bp-arm"]:checked') || {}).value || '', note: q('#bp-note').value.trim(), by: editing ? editing.by : AP().name };
        rec.updatedAt = isoLocal(new Date()); if (editing) Object.assign(editing, rec); else p.measurements.push(rec);
        save(); dlg.close(); toast(`Meting ${s}/${d} opgeslagen voor ${p.name}.`); render(true);
      };
      q('#bp-s').focus();
    } });
}
function bpTargetDialog(pid) {

  openDialog({ title: `Streefwaarde – ${esc(p.name)}`,
    body: `<p class="muted small">Neem de streefwaarde over die uw huisarts heeft afgesproken. Een meting vanaf deze waarde geldt als "boven streefwaarde".</p>
     <div class="fgrid c2"><div class="field"><label for="tg-s">Bovendruk onder</label><input type="number" id="tg-s" min="100" max="200" value="${t.sys}"></div><div class="field"><label for="tg-d">Onderdruk onder</label><input type="number" id="tg-d" min="50" max="120" value="${t.dia}"></div></div>`,
    actions: `<button type="button" class="btn" data-close>Annuleren</button><button type="button" class="btn primary" id="tg-ok">Opslaan</button>`,
    onOpen: d => { d.querySelector('#tg-s').focus(); d.querySelector('#tg-ok').onclick = () => { const s = parseInt(d.querySelector('#tg-s').value, 10), di = parseInt(d.querySelector('#tg-d').value, 10);
      if (!(s >= 100 && s <= 200 && di >= 50 && di <= 120)) { toast('Kies een bovendruk tussen 100 en 200 en een onderdruk tussen 50 en 120.'); return; }
      p.bpTarget = { sys: s, dia: di }; p.updatedAt = isoLocal(new Date()); save(); d.close(); render(true); toast('Streefwaarde opgeslagen.'); }; } });
}
function fireBpReminder(isTest) {
  const todo = state.profiles.filter(p => !thisMonthDone(p));
  const body = todo.length ? `Deze maand nog niet gemeten: ${todo.map(p => p.name).join(' en ')}.` : 'Iedereen heeft deze maand al gemeten.';
  beep(); vibrate(); flashTitle(); notify('❤️ Bloeddruk meten', body, 'bp-reminder');
  openDialog({ title: `${ic('heart')} ${isTest ? 'Test: ' : ''}Maandelijkse bloeddrukmeting`, body: `<p>${esc(body)}</p><p class="muted small">Zit eerst 5 minuten rustig voordat u meet.</p>`,
    actions: `<button type="button" class="btn" data-close>Later</button><button type="button" class="btn primary" data-go-bp>Meting invoeren</button>`,
    onOpen: dlg => { dlg.querySelector('[data-go-bp]').onclick = () => { dlg.close(); go('bp'); if (todo.length) bpDialog(todo[0].id); }; } });
}

  const rows = profiles.flatMap(p => (p.measurements || []).filter(m => m.ts.slice(0, 10) >= since).map(m => ({ p, m }))).sort((a, b) => b.m.ts.localeCompare(a.m.ts));
  return `<section class="card" aria-labelledby="lbp-h"><h2 id="lbp-h">${ic('heart')} Bloeddruk & hartslag (${rows.length})</h2>
   ${rows.length ? `<div class="table-wrap"><table><thead><tr><th scope="col">Datum</th>${profiles.length > 1 ? '<th scope="col">Persoon</th>' : ''}<th scope="col">Bloeddruk</th><th scope="col">Hartslag</th><th scope="col">Beoordeling</th><th scope="col">Gelogd door</th></tr></thead><tbody>
   ${rows.map(({ p, m }) => { const a = bpAssess(p, m); return `<tr><td>${fmtDT(m.ts)}</td>${profiles.length > 1 ? `<td>${esc(p.name)}</td>` : ''}<td><b>${m.sys}/${m.dia}</b></td><td>${m.pulse || '—'}</td><td><span class="chip ${CHIP[a.lvl]}">${esc(a.cls.label)}</span>${m.note ? `<div class="small">${esc(m.note)}</div>` : ''}</td><td>${esc(m.by || '—')}</td></tr>`; }).join('')}
   </tbody></table></div>` : '<p class="muted">Geen metingen in deze periode.</p>'}
   <button type="button" class="btn small" data-act="nav" data-view="bp">${ic('heart', 18)} Naar bloeddruk</button></section>`;
}
function printBpDialog() {
  openDialog({ title: 'Bloeddrukrapport printen',
    body: `<div class="field"><label for="pb-p">Persoon</label><select id="pb-p"><option value="both">Beide personen</option>${state.profiles.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
     <div class="field"><label for="pb-m">Periode</label><select id="pb-m"><option value="3">Laatste 3 maanden</option><option value="6">Laatste 6 maanden</option><option value="12" selected>Laatste 12 maanden</option><option value="0">Alle metingen</option></select></div>

    onOpen: d => { d.querySelector('#pb-p').focus(); d.querySelector('#pb-go').onclick = () => { const o = { p: d.querySelector('#pb-p').value, months: +d.querySelector('#pb-m').value, note: d.querySelector('#pb-n').value.trim() }; S().bpReportNote = o.note; S().updatedAt = isoLocal(new Date()); save(); d.close(); printBp(o); }; } });
}
function printBp(o) {
  const now = new Date(), profiles = o.p === 'both' ? state.profiles : [P(o.p)];
  const since = o.months ? ymd(addMonths(now, -o.months)) : '0000';
  const monthly = list => { const g = {}; list.forEach(m => (g[m.ts.slice(0, 7)] = g[m.ts.slice(0, 7)] || []).push(m)); return Object.keys(g).sort(); };
  doPrint(`<h1>Rapport bloeddruk & hartslag</h1><p>Periode: ${o.months ? `${fmtDate(since)} t/m ${fmtDate(now)}` : 'alle metingen'} · afgedrukt ${fmtDT(now)}</p>
   ${profiles.map((p, i) => { const list = (p.measurements || []).filter(m => m.ts.slice(0, 10) >= since).sort(bpSortAsc); const sm = bpSummary(p, list), t = bpTarget(p);
     const months = monthly(list);

     ${sm.n ? `<table><tbody><tr><th>Aantal metingen</th><td>${sm.n}</td><th>Gemiddeld</th><td>${sm.s}/${sm.d} mmHg${sm.pu ? ` · hartslag ${sm.pu}` : ''}</td></tr>
       <tr><th>Hoogste bovendruk</th><td>${sm.hi.sys}/${sm.hi.dia} (${fmtDate(sm.hi.ts)})</td><th>Laagste bovendruk</th><td>${sm.lo.sys}/${sm.lo.dia} (${fmtDate(sm.lo.ts)})</td></tr>
       <tr><th>Boven streefwaarde</th><td>${sm.above} van ${sm.n}</td><th>Verloop bovendruk</th><td>${sm.trend}</td></tr></tbody></table>
     <p><b>Beoordeling:</b> ${esc(sm.text)}</p>
     ${list.length >= 2 ? `<div class="pchart">${bpChart(p, list, true)}${bpLegend()}</div>` : ''}
     ${months.length > 1 ? `<table><thead><tr><th>Maand</th><th>Metingen</th><th>Gem. bloeddruk</th><th>Gem. hartslag</th><th>Beoordeling</th></tr></thead><tbody>${months.map(k => { const ml = list.filter(m => m.ts.startsWith(k)); const s2 = bpSummary(p, ml); const [y, mo] = k.split('-'); return `<tr><td>${['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'][+mo - 1]} ${y}</td><td>${ml.length}</td><td>${s2.s}/${s2.d}</td><td>${s2.pu || '—'}</td><td>${esc(s2.cls.label)}${aboveTarget(p, s2.s, s2.d) ? ', boven streef' : ''}</td></tr>`; }).join('')}</tbody></table>` : ''}
     <table><thead><tr><th>Datum</th><th>Tijd</th><th>Bloeddruk</th><th>Hartslag</th><th>Arm</th><th>Beoordeling</th><th>Eigen opmerking</th></tr></thead><tbody>
     ${list.map(m => { const a = bpAssess(p, m); return `<tr><td>${fmtDate(m.ts)}</td><td>${fmtTime(new Date(m.ts))}</td><td><b>${m.sys}/${m.dia}</b></td><td>${m.pulse || '—'}</td><td>${esc(m.arm || '—')}</td><td>${esc(a.cls.label)}${a.above ? ', boven streef' : ''}</td><td>${esc(m.note || '')}</td></tr>`; }).join('')}</tbody></table>`
     : '<p>Geen metingen in deze periode.</p>'}</section>`; }).join('')}
   ${o.note ? `<h2>Algemene beoordeling</h2><p>${esc(o.note).replace(/\n/g, '<br>')}</p>` : ''}

}
